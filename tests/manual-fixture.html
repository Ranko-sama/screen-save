<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Screen Save 静态验证</title>
<style>
body{font:20px system-ui;margin:40px;color:#17212c;background:#f5f5f5}
.colors{display:flex;width:720px;height:100px;margin:30px 0}.colors div{flex:1}
input,button{font:inherit;padding:8px}#status{margin-top:24px}
</style>
<h1>Screen Save 静态验证</h1>
<p>本地静态页面：无动画、无定时器、无网络请求。</p>
<div class="colors"><div style="background:white"></div><div style="background:red"></div><div style="background:#0f0"></div><div style="background:blue"></div><div style="background:#888"></div><div style="background:black"></div></div>
<label>输入验证 <input id="entry" placeholder="输入测试文字"></label>
<button id="confirm" onclick="document.querySelector('#status').textContent='确认：'+document.querySelector('#entry').value">确认</button>
<p id="status">等待操作</p>
</html>
